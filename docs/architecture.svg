<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="930" viewBox="0 0 1180 930" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="930" fill="#ffffff"/>

  <!-- Title -->
  <text x="590" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">AI Resume &amp; Career Platform — Architecture</text>
  <text x="590" y="54" text-anchor="middle" font-size="13" fill="#64748b">React + Tailwind frontend · FastAPI backend · shared Python AI core (Gemini · local embeddings · OCR)</text>

  <!-- ============ CLIENT BAND ============ -->
  <rect x="40" y="70" width="1100" height="140" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="56" y="92" font-size="13" font-weight="700" fill="#4338ca">1 · CLIENT  —  browser</text>

  <rect x="64" y="104" width="290" height="92" rx="10" fill="#ffffff" stroke="#6366f1"/>
  <text x="209" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Jobs Board</text>
  <text x="209" y="155" text-anchor="middle" font-size="12" fill="#475569">search · JobCard</text>
  <text x="209" y="172" text-anchor="middle" font-size="12" fill="#475569">match % badges</text>

  <rect x="370" y="104" width="290" height="92" rx="10" fill="#ffffff" stroke="#6366f1"/>
  <text x="515" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">NK Chat Sidebar</text>
  <text x="515" y="155" text-anchor="middle" font-size="12" fill="#475569">ChatPanel · Message</text>
  <text x="515" y="172" text-anchor="middle" font-size="12" fill="#475569">live streaming reply</text>

  <rect x="676" y="104" width="180" height="92" rx="10" fill="#ffffff" stroke="#6366f1"/>
  <text x="766" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">api.js</text>
  <text x="766" y="161" text-anchor="middle" font-size="12" fill="#475569">fetch + stream</text>

  <rect x="872" y="104" width="240" height="92" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-dasharray="5 4"/>
  <text x="992" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Streamlit App</text>
  <text x="992" y="155" text-anchor="middle" font-size="12" fill="#475569">legacy dashboard</text>
  <text x="992" y="172" text-anchor="middle" font-size="12" fill="#475569">+ HR / recruiter mode</text>

  <!-- ============ API BAND ============ -->
  <rect x="40" y="238" width="1100" height="150" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="56" y="260" font-size="13" font-weight="700" fill="#0e7490">2 · API  —  FastAPI / Uvicorn  (chat_api.py · :8000)</text>

  <rect x="64" y="272" width="250" height="40" rx="20" fill="#cffafe" stroke="#06b6d4"/>
  <text x="189" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">GET /api/health</text>
  <rect x="330" y="272" width="250" height="40" rx="20" fill="#cffafe" stroke="#06b6d4"/>
  <text x="455" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">POST /api/resume</text>
  <rect x="596" y="272" width="250" height="40" rx="20" fill="#cffafe" stroke="#06b6d4"/>
  <text x="721" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">GET /api/jobs</text>
  <rect x="862" y="272" width="250" height="40" rx="20" fill="#cffafe" stroke="#06b6d4"/>
  <text x="987" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">POST /api/chat (stream)</text>

  <rect x="64" y="328" width="520" height="46" rx="10" fill="#ffffff" stroke="#06b6d4"/>
  <text x="324" y="356" text-anchor="middle" font-size="12.5" fill="#475569">In-memory session store {resume, info, background, embedding}</text>
  <rect x="600" y="328" width="512" height="46" rx="10" fill="#ffffff" stroke="#06b6d4"/>
  <text x="856" y="356" text-anchor="middle" font-size="12.5" fill="#475569">Job-embedding cache (embed the 30 jobs once)</text>

  <!-- ============ CORE BAND ============ -->
  <rect x="40" y="416" width="1100" height="200" rx="14" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="438" font-size="13" font-weight="700" fill="#b45309">3 · PYTHON CORE  —  shared by both front-ends</text>

  <rect x="64" y="450" width="250" height="72" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="189" y="480" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">app.py</text>
  <text x="189" y="500" text-anchor="middle" font-size="11.5" fill="#475569">PDF/OCR · Gemini parse</text>

  <rect x="330" y="450" width="250" height="72" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="455" y="480" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">chat_service.py</text>
  <text x="455" y="500" text-anchor="middle" font-size="11.5" fill="#475569">NK persona · streaming</text>

  <rect x="596" y="450" width="250" height="72" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="721" y="480" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">main_job_matcher.py</text>
  <text x="721" y="500" text-anchor="middle" font-size="11.5" fill="#475569">embeddings · cosine sim</text>

  <rect x="862" y="450" width="250" height="72" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="987" y="480" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">market_insight_service</text>
  <text x="987" y="500" text-anchor="middle" font-size="11.5" fill="#475569">offline job dataset</text>

  <rect x="64" y="536" width="636" height="64" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="382" y="563" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Report services</text>
  <text x="382" y="582" text-anchor="middle" font-size="11.5" fill="#475569">skill gap · interview · roadmap · LinkedIn · resume audit · scoring</text>

  <rect x="716" y="536" width="190" height="64" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="811" y="566" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">schemas.py</text>
  <text x="811" y="585" text-anchor="middle" font-size="11.5" fill="#475569">Pydantic models</text>

  <rect x="922" y="536" width="190" height="64" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="1017" y="566" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">local_embeddings</text>
  <text x="1017" y="585" text-anchor="middle" font-size="11.5" fill="#475569">MiniLM wrapper</text>

  <!-- ============ MODELS / DATA BAND ============ -->
  <rect x="40" y="644" width="1100" height="186" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="56" y="666" font-size="13" font-weight="700" fill="#15803d">4 · MODELS &amp; DATA  —  external + local</text>

  <rect x="64" y="678" width="336" height="64" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="232" y="705" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">Google Gemini</text>
  <text x="232" y="724" text-anchor="middle" font-size="11.5" fill="#475569">LLM — parse · chat · reports</text>

  <rect x="416" y="678" width="336" height="64" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="584" y="705" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">sentence-transformers (MiniLM)</text>
  <text x="584" y="724" text-anchor="middle" font-size="11.5" fill="#475569">local embeddings — free, no quota</text>

  <rect x="768" y="678" width="344" height="64" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="940" y="705" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">Tesseract OCR</text>
  <text x="940" y="724" text-anchor="middle" font-size="11.5" fill="#475569">local — scanned-PDF fallback</text>

  <rect x="64" y="756" width="250" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="189" y="784" text-anchor="middle" font-size="12" fill="#334155">job_metadata.json (30)</text>
  <rect x="330" y="756" width="250" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="455" y="784" text-anchor="middle" font-size="12" fill="#334155">Resume PDF (input)</text>
  <rect x="596" y="756" width="250" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="721" y="784" text-anchor="middle" font-size="12" fill="#334155">Live: JSearch · merojob</text>
  <rect x="862" y="756" width="250" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="987" y="784" text-anchor="middle" font-size="12" fill="#334155">FAISS index</text>

  <!-- ============ FLOW ARROWS (left channel) ============ -->
  <line x1="360" y1="210" x2="360" y2="237" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="228" font-size="11.5" fill="#475569">HTTP /api/* · fetch + streamed text</text>

  <line x1="360" y1="388" x2="360" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="406" font-size="11.5" fill="#475569">Python function calls</text>

  <line x1="360" y1="616" x2="360" y2="643" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="634" font-size="11.5" fill="#475569">LLM calls · local inference · file reads</text>

  <!-- Streamlit talks to the core directly (right channel) -->
  <polyline points="992,196 992,222 1150,222 1150,432 1142,432" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1086" y="216" font-size="11" fill="#6366f1">direct (no API)</text>

  <!-- ============ LEGEND ============ -->
  <text x="56" y="860" font-size="12" font-weight="700" fill="#1e293b">Legend</text>
  <rect x="120" y="850" width="14" height="14" rx="3" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="140" y="861" font-size="12" fill="#475569">Client</text>
  <rect x="200" y="850" width="14" height="14" rx="3" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="220" y="861" font-size="12" fill="#475569">API</text>
  <rect x="270" y="850" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="290" y="861" font-size="12" fill="#475569">Python core</text>
  <rect x="378" y="850" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="398" y="861" font-size="12" fill="#475569">Models / data</text>

  <text x="590" y="900" text-anchor="middle" font-size="11" fill="#94a3b8">Upload → extract (PyMuPDF / OCR) → Gemini parse → embed → session → jobs match (local) + NK chat (resume- &amp; job-aware)</text>
</svg>
